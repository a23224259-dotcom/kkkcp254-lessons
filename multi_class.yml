name: Multi-class Telegram lessons

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min, 24h; script maps time to EAT slots
  workflow_dispatch:          # manual "Run workflow" delivery test

permissions:
  contents: write             # lets the job commit multi_class_state.json

concurrency:
  group: multi-class-telegram
  cancel-in-progress: false   # never run two deliveries at once

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt

      - name: Send lesson (poster + PDF + text) for the current class
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python multi_class.py

      - name: Commit updated state (prevents repeats)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multi_class_state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update lesson state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
